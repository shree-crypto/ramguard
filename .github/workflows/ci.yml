name: Windows checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    strategy:
      matrix:
        profile: [default, m5-tools]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install stable Rust
        run: rustup toolchain install stable --profile minimal --component rustfmt
      - name: Check formatting
        run: cargo +stable fmt --all -- --check
      - name: Test default profile
        if: matrix.profile == 'default'
        run: cargo +stable test --locked
      - name: Test optional M5 profile
        if: matrix.profile == 'm5-tools'
        run: cargo +stable test --locked --features m5-tools
